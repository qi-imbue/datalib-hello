[package]
name = "datalib-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT AND Apache-2.0"
description = "Write the stores a datalib source's steps produce, from outside datalib."
publish = false
links = "doltlite"

[dependencies]
# Pure Rust: doltlite carries its own C blake3, and the C one here would
# define the same symbols.
blake3 = { version = "1", features = ["pure"] }
sha1_smol = "1"
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[build-dependencies]
cc = "1"
sha2 = "0.10"
