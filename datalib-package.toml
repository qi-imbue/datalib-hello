# A datalib package: see https://github.com/imbue-ai/datalib/blob/main/docs/dev/packages.md
schema = 1
name = "Hello"
version = "0.3.0"
description = "Writes a greeting each sync, renders it as a document and a time series, and adds a card that lists them."
homepage = "https://github.com/qi-imbue/datalib-hello"
step_protocol = 1

[[sources]]
type = "hello"
commands = { ingest = "bin/hello-ingest", render_markdown = "bin/hello-render", render_time_series = "bin/hello-time-series" }

[sources.wizard]
label = "Hello"
blurb = "Writes a greeting each sync: a document per greeting, and a time series of them."
nameHint = "Hello test"
defaultName = "hello"
sections = [{ heading = "What to say", fields = ["greeting"] }]
fields = [{ kind = "text", target = "greeting", label = "Greeting", required = true }]

[[sources.applets]]
id = "greetings"
command = "bin/hello-greetings"
